name: Build gallery

# Whenever images are added/removed under gallery/originals/, regenerate the
# thumbnails, full-size images, and manifest.json, then commit them back.
on:
  push:
    paths:
      - 'gallery/originals/**'
      - 'tools/build-gallery.mjs'
      - '.github/workflows/gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build gallery
        run: npm run build:gallery

      - name: Commit generated gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gallery/thumbs gallery/full gallery/manifest.json
          if git diff --cached --quiet; then
            echo "No gallery changes to commit."
          else
            git commit -m "chore: rebuild gallery [skip ci]"
            git push
          fi
